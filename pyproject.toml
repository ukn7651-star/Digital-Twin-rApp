[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtrapp"
version = "0.1.0"
description = "Digital Twin rApp - offline ray-traced downlink throughput engine (v1)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "requests>=2.31",
    "shapely>=2.0",
    "pyproj>=3.6",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Ray-tracing propagation engine. Heavy; install when running the full pipeline.
rt = ["sionna-rt>=1.0"]
dev = ["pytest>=7.4"]

[project.scripts]
dtrapp = "dtrapp.runner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dtrapp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
